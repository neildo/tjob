name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      # namespaces and cgroup v2 need root; without it those tests skip
      - name: test as root
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOMODCACHE,GOCACHE "$(which go)" test -race -shuffle on -count=1 -v ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
